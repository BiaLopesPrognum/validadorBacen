name: Check Validador Version

on:
  schedule:
    - cron: "0 */3 * * *"  # Executa a cada 3 horas
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Modo teste: notifica no espaço de teste e não grava estado nem cria release real"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar curl e grep
        run: sudo apt-get update && sudo apt-get install -y curl grep

      - name: Verificar horário atual (executar apenas entre 07h e 19h)
        run: |
          HORA=$(TZ="America/Sao_Paulo" date +%H)
          echo "Hora atual: $HORA"
          if [ "$HORA" -lt 7 ] || [ "$HORA" -ge 19 ]; then
            echo "Fora do horário permitido (07h–19h). Encerrando workflow."
            exit 1
          fi

      - name: Obter versão atual do site (com dupla confirmação)
        id: get_version
        run: |
          fetch_version() {
            HTTP_CODE=$(curl -s -o /tmp/page.json -w "%{http_code}" \
              -A "Mozilla/5.0 (compatible; ValidadorBacenChecker/1.0)" \
              https://www.bcb.gov.br/api/paginasite/sitebcb/estabilidadefinanceira/scrdoc3040)
            echo "  [debug] HTTP status: $HTTP_CODE" >&2
            echo "  [debug] Tamanho da resposta: $(wc -c < /tmp/page.json) bytes" >&2
            echo "  [debug] Primeiros 500 caracteres da resposta:" >&2
            head -c 500 /tmp/page.json >&2
            echo "" >&2
            # A página traz sempre dois números "Release ####" na mesma resposta:
            # um rotulado "Versão Atual" e outro "Versão Anterior", possivelmente
            # separados por quebras de linha. Pegamos o que vem logo após "Atual"
            # (modo multilinha com -z/(?s), nunca o primeiro/maior encontrado).
            grep -Pzo '(?s)Atual.{0,300}?Release[[:space:]]+\K[0-9]+' /tmp/page.json | head -z -n1 | tr -d '\0'
          }

          VERSION_1=$(fetch_version)
          echo "1ª leitura: $VERSION_1"

          sleep 20

          VERSION_2=$(fetch_version)
          echo "2ª leitura: $VERSION_2"

          if [ -z "$VERSION_1" ] || [ -z "$VERSION_2" ]; then
            echo "Nenhuma versão encontrada em uma das leituras da página!"
            echo "confirmed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$VERSION_1" != "$VERSION_2" ]; then
            echo "⚠️ Leituras divergentes ($VERSION_1 vs $VERSION_2) - provável cache/CDN inconsistente. Ignorando este ciclo."
            echo "confirmed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Versão confirmada em duas leituras: $VERSION_1"
          echo "confirmed=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION_1" >> $GITHUB_OUTPUT

      - name: Comparar com última versão registrada
        id: compare
        if: steps.get_version.outputs.confirmed == 'true'
        run: |
          FILE="ultima_versao.txt"
          PENDING_FILE="pending_downgrade.txt"

          if [ -f "$FILE" ]; then
            LAST=$(cat "$FILE")
          else
            LAST="none"
          fi

          if [ -f "$PENDING_FILE" ]; then
            PENDING=$(cat "$PENDING_FILE")
          else
            PENDING=""
          fi

          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Última versão registrada: $LAST"
          echo "Candidato a downgrade pendente (ciclo anterior): ${PENDING:-nenhum}"
          echo "Nova versão confirmada: $VERSION"

          echo "changed=false" >> $GITHUB_OUTPUT
          echo "state_write=false" >> $GITHUB_OUTPUT
          echo "last_version=$LAST" >> $GITHUB_OUTPUT

          if [ "$LAST" == "$VERSION" ]; then
            echo "Nenhuma mudança detectada."
            if [ -n "$PENDING" ]; then
              echo "Versão voltou ao valor registrado - descartando candidato a downgrade pendente."
              rm -f "$PENDING_FILE"
              echo "state_write=true" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          if [ "$LAST" == "none" ] || [ "$VERSION" -gt "$LAST" ] 2>/dev/null; then
            echo "Nova versão detectada!"
            rm -f "$PENDING_FILE"
            echo "$VERSION" > "$FILE"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "state_write=true" >> $GITHUB_OUTPUT
            echo "is_downgrade=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # VERSION < LAST: candidato a downgrade. Só confirma (grava estado e alerta)
          # se a MESMA versão menor já tinha aparecido como candidata no ciclo agendado anterior,
          # blindando contra cache/CDN do Bacen servindo conteúdo desatualizado por horas.
          if [ "$PENDING" == "$VERSION" ]; then
            echo "⚠️ Downgrade confirmado em dois ciclos consecutivos (versão $VERSION menor que $LAST)."
            echo "$VERSION" > "$FILE"
            rm -f "$PENDING_FILE"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "state_write=true" >> $GITHUB_OUTPUT
            echo "is_downgrade=true" >> $GITHUB_OUTPUT
          else
            echo "Possível downgrade ($VERSION menor que $LAST) - aguardando confirmação no próximo ciclo agendado antes de alertar."
            echo "$VERSION" > "$PENDING_FILE"
            echo "state_write=true" >> $GITHUB_OUTPUT
          fi

      - name: Baixar nova versão do Validador
        if: steps.compare.outputs.changed == 'true' && github.event.inputs.test_mode != 'true'
        run: |
          echo "⬇️ Baixando nova versão do Validador..."
          curl -L "https://www.bcb.gov.br/content/estabilidadefinanceira/Leiaute_de_documentos/scrdoc3040/SCR3040_Validador.zip" -o "SCR3040_Validador.zip"
          echo "✅ Download concluído."

      - name: Persistir estado (versão registrada / candidato a downgrade)
        if: steps.compare.outputs.state_write == 'true' && github.event.inputs.test_mode != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Atualiza estado do checker de versão (leitura: ${{ steps.get_version.outputs.version }})"
          git push

      - name: Criar Release no GitHub (com o ZIP anexado)
        if: steps.compare.outputs.changed == 'true' && github.event.inputs.test_mode != 'true'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "Validador BACEN - Versão ${{ steps.get_version.outputs.version }}"
          body: |
            ${{ steps.compare.outputs.is_downgrade == 'true' && '⚠️ Downgrade detectado automaticamente pelo workflow.' || 'Nova versão detectada automaticamente pelo workflow.' }}

            🔹 Versão anterior: ${{ steps.compare.outputs.last_version }}
            🔹 Nova versão: ${{ steps.get_version.outputs.version }}

            🔗 [Baixar Validador BACEN (link oficial)](https://www.bcb.gov.br/content/estabilidadefinanceira/Leiaute_de_documentos/scrdoc3040/SCR3040_Validador.zip)
          files: SCR3040_Validador.zip

      - name: Notificar no Google Chat (nova versão detectada)
        if: steps.compare.outputs.changed == 'true'
        env:
          CHAT_WEBHOOK: ${{ github.event.inputs.test_mode == 'true' && secrets.TEST_CHAT_WEBHOOK || secrets.GOOGLE_CHAT_WEBHOOK }}
          CARD_TITLE: ${{ steps.compare.outputs.is_downgrade == 'true' && '⚠️ Downgrade do Validador BACEN detectado' || 'Nova versão do Validador BACEN detectada' }}
          TEST_PREFIX: ${{ github.event.inputs.test_mode == 'true' && '[TESTE] ' || '' }}
        run: |
          cat <<EOF > payload.json
          {
            "cardsV2": [
              {
                "cardId": "validador-update",
                "card": {
                  "header": {
                    "title": "$TEST_PREFIX$CARD_TITLE",
                    "subtitle": "Workflow: Check Validador Version",
                    "imageUrl": "https://cdn-icons-png.flaticon.com/512/564/564619.png",
                    "imageType": "SQUARE",
                  },
                  "sections": [
                    {
                      "header": "Detalhes da atualização",
                      "widgets": [
                        {
                          "decoratedText": {
                            "topLabel": "Versão anterior",
                            "text": "${{ steps.compare.outputs.last_version }}"
                          }
                        },
                        {
                          "decoratedText": {
                            "topLabel": "Nova versão",
                            "text": "${{ steps.get_version.outputs.version }}"
                          }
                        },
                        {
                          "buttonList": {
                            "buttons": [
                              {
                                "text": "Baixar Validador (link oficial)",
                                "onClick": {
                                  "openLink": {
                                    "url": "https://www.bcb.gov.br/content/estabilidadefinanceira/Leiaute_de_documentos/scrdoc3040/SCR3040_Validador.zip"
                                  }
                                }
                              }
                            ]
                          }
                        }
                      ]
                    }
                  ]
                }
              }
            ]
          }
          EOF

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$CHAT_WEBHOOK"
